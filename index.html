<!-- Seção das cartas (leque) -->
<section id="cardsSection" class="fan-area" aria-label="Leque de cartas">
  <!-- Cada carta é um article com dados da carta -->
  <article class="card card-1" data-index="0" style="--c-color: #1e90ff;">
    <span class="card-symbol" aria-label="símbolo romance">♥️</span>
  </article>
  <article class="card card-2" data-index="1" style="--c-color: #00bcd4;">
    <span class="card-symbol" aria-label="símbolo romance">♡</span>
  </article>
  <article class="card card-3" data-index="2" style="--c-color: #e53935;">
    <span class="card-symbol" aria-label="símbolo romance">💋</span>
  </article>
  <article class="card card-4" data-index="3" style="--c-color: #8e24aa;">
    <span class="card-symbol" aria-label="símbolo romance">✦</span>
  </article>
  <article class="card card-5" data-index="4" style="--c-color: #ff4d8a;">
    <span class="card-symbol" aria-label="símbolo romance">✨</span>
  </article>
  <article class="card card-6" data-index="5" style="--c-color: #3f51b5;">
    <span class="card-symbol" aria-label="símbolo romance">💙</span>
  </article>
</section>

<!-- Tela da pergunta (oculta inicialmente) -->
<section id="questionPanel" class="question-panel" aria-label="Pergunta de flerte" hidden>
  <div class="card question-card" role="region" aria-label="Pergunta de flerte">
    <div class="neon-label" aria-label="SUSPEITA NEON">SURPRESA ✨</div>
    <h2 class="question-title">Cuidado...</h2>
    <p id="questionText" class="question-text"></p>

    <button id="waBtn" class="cta-whatsapp" aria-label="Enviar no WhatsApp">
      💬 Enviar no WhatsApp
    </button>

    <button id="backBtn" class="back-btn" aria-label="Voltar às cartas">
      ← Voltar às cartas
    </button>
  </div>
</section>
